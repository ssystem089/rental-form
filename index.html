<script>
  function updateLensOptions() {

    if (model === "vivo x300 Ultra") {
      lensSelect.innerHTML = `
        <option value="無加選配件 (單機身)">無加選配件 (單機身)</option>
        <option value="加租 200mm 增距鏡 (+$300/D)">加租 200mm 增距鏡 (+$300/D)</option>
        <option value="加租 400mm 增距鏡 (+$600/D)">加租 400mm 增距鏡 (+$600/D)</option>
      `;
    } else if (model === "vivo x200 Ultra" || model === "vivo x300 Pro") {
      lensSelect.innerHTML = `
        <option value="無加選配件 (單機身)">無加選配件 (單機身)</option>
        <option value="加租 200mm 增距鏡 (+$300/D)">加租 200mm 增距鏡 (+$300/D)</option>
      `;
    } else if (model === "OPPO Find X9 Ultra") {
      lensSelect.innerHTML = `
        <option value="無加選配件 (單機身)">無加選配件 (單機身)</option>
        <option value="加租 400mm 增距鏡 (+$600/D)">加租 400mm 增距鏡 (+$600/D)</option>
      `;
    } else if (model === "僅租借 G2 增距鏡頭特仕組") {
      lensSelect.innerHTML = `
        <option value="單租 200mm 增距鏡 ($300/D)">單租 200mm 增距鏡 ($300/D)</option>
        <option value="單租 400mm 增距鏡 ($600/D)">單租 400mm 增距鏡 ($600/D)</option>
      `;
    } else {
      lensSelect.innerHTML = `
        <option value="無適配增距鏡">無適配增距鏡 (單機身)</option>
      `;
    }
  }

  function buildBookingMessage() {
    const model = document.getElementById("model").value;
    const lens = document.getElementById("lens").value;
    const cloud = document.getElementById("cloudService").value;
    const pickupValue = document.getElementById("pickupTime").value;
    const returnDate = document.getElementById("returnDate").value;
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const idType = document.getElementById("idType").value;
    const isStore = document.getElementById("isStore").value;

    if (!pickupValue || !returnDate || !name || !phone) {
      alert("請填寫完整的預約日期時間、姓名與聯絡電話。");
      return null;
    }

    const pickupTime = pickupValue.replace("T", " ");
    const pickupDate = new Date(pickupValue);
    const returnedDate = new Date(returnDate + "T00:00:00");

    const days = Math.max(
      1,
      Math.ceil((returnedDate - pickupDate) / (1000 * 60 * 60 * 24))
    );

    let itemDetails = model;

    if (
      lens !== "無加選配件 (單機身)" &&
      lens !== "無適配增距鏡"
    ) {
      itemDetails += ` + ${lens}`;
    }

    if (cloud.startsWith("Yes")) {
      itemDetails += " + 雲端上傳服務";
    }

    return `※租借器材：${itemDetails}
※預約日期：${pickupTime} 取 / ${returnDate} 還
※租借天數：${days} 天
※姓名：${name}
※電話：${phone}
押附證件：${idType}
台北大巨蛋門市交還機：${isStore}

基礎訂金 - 700元 (抵扣租金/報價為主)
預付定金方式 - 屬名本人帳號匯款
押金支付方式 - 現金 (交還退還含證件裝釘信封)`;
  }

  async function copyBookingText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";

      document.body.appendChild(textarea);
      textarea.select();

      const result = document.execCommand("copy");
      document.body.removeChild(textarea);

      return result;
    } catch (error) {
      console.error("複製失敗：", error);
      return false;
    }
  }

  async function submitBooking() {
    const message = buildBookingMessage();

    if (!message) return;

    const isCopied = await copyBookingText(message);

    showCopyPanel(message, isCopied);
  }

      border-radius: 16px 16px 0 0;

      box-shadow: 0 -8px 30px rgba(0,0,0,.45);

    `;

    panel.innerHTML = `

      </div>

      </div>
