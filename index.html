<!--
  重要：LINE LIFF 沒有官方 API 可以「直接把文字塞進聊天室輸入框、讓客人自行按送出」。
  可行且穩定的替代方案：表單送出後，顯示已整理好的預約文字，客人按「複製預約內容」，
  再按「回到聊天室」並長按貼上送出。此版本完全移除 liff.sendMessages()，因此不會再出現 access_token 錯誤。

  使用方式：將原 index.html 中的整個 <script>...</script> 區塊替換為本檔內容。
-->
<script>
  function buildBookingMessage() {
    const model = document.getElementById("model").value;
    const lens = document.getElementById("lens").value;
    const cloud = document.getElementById("cloudService").value;
    const pickupValue = document.getElementById("pickupTime").value;
    const returnDate = document.getElementById("returnDate").value;
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const idType = document.getElementById("idType").value;
    const isStore = document.getElementById("isStore").value;

    if (!pickupValue || !returnDate || !name || !phone) {
      alert("請填寫完整的預約日期時間、姓名與聯絡電話。");
      return null;
    }

    const pickupTime = pickupValue.replace("T", " ");
    const pDate = new Date(pickupValue);
    const rDate = new Date(returnDate + "T00:00:00");
    const days = Math.max(1, Math.ceil((rDate - pDate) / (1000 * 60 * 60 * 24)));

    let itemDetails = model;
    if (lens !== "無加選配件 (單機身)" && lens !== "無適配增距鏡") {
      itemDetails += ` + ${lens}`;
    }
    if (cloud.startsWith("Yes")) {
      itemDetails += " + 雲端上傳服務";
    }

    return `※租借器材：${itemDetails}
※預約日期：${pickupTime} 取 / ${returnDate} 還
※租借天數：${days} 天
※姓名：${name}
※電話：${phone}
押附證件：${idType}
台北大巨蛋門市交還機：${isStore}

基礎訂金 - 700元 (抵扣租金/報價為主)
預付定金方式 - 屬名本人帳號匯款
押金支付方式 - 現金 (交還退還含證件裝釘信封)`;
  }

  async function submitBooking() {
    const message = buildBookingMessage();
    if (!message) return;

    const copied = await copyText(message);
    showBookingResult(message, copied);
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const success = document.execCommand("copy");
      document.body.removeChild(textarea);
      return success;
    } catch (err) {
      console.warn("複製失敗", err);
      return false;
    }
  }

  function showBookingResult(message, copied) {
    const old = document.getElementById("bookingResult");
    if (old) old.remove();

    const panel = document.createElement("div");
    panel.id = "bookingResult";
    panel.style.cssText = "position:fixed;z-index:9999;left:0;right:0;bottom:0;background:#18181b;color:#f4f4f5;border-top:1px solid #3f3f46;border-radius:16px 16px 0 0;padding:18px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;box-shadow:0 -8px 30px rgba(0,0,0,.45);";

    const status = copied ? "預約內容已複製" : "請手動複製下方預約內容";
    const guide = copied
      ? "請點下方按鈕回到 LINE 聊天室，在輸入框長按後選擇「貼上」，再自行確認送出。"
      : "請長按下方文字複製，回到 LINE 聊天室後貼上並送出。";

    panel.innerHTML = `
      <div style="font-size:17px;font-weight:700;margin-bottom:6px;">${status}</div>
      <div style="font-size:13px;line-height:1.55;color:#a1a1aa;margin-bottom:12px;">${guide}</div>
      <textarea id="bookingText" readonly style="width:100%;height:175px;box-sizing:border-box;resize:none;background:#09090b;color:#f4f4f5;border:1px solid #3f3f46;border-radius:8px;padding:10px;font-size:12px;line-height:1.55;">${escapeHtml(message)}</textarea>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button id="copyAgain" style="flex:1;background:#27272a;border:1px solid #52525b;color:#fff;border-radius:8px;padding:12px;font-size:14px;font-weight:600;">複製預約內容</button>
        <button id="backToChat" style="flex:1;background:#fff;border:0;color:#000;border-radius:8px;padding:12px;font-size:14px;font-weight:700;">回到聊天室</button>
      </div>`;

    document.body.appendChild(panel);
    const textArea = document.getElementById("bookingText");
    textArea.focus();
    textArea.select();

    document.getElementById("copyAgain").addEventListener("click", async () => {
      const success = await copyText(message);
      alert(success ? "已複製，請回到聊天室貼上。" : "複製未成功，請長按預約內容手動複製。");
    });

    document.getElementById("backToChat").addEventListener("click", () => {
      // 不使用 sendMessages；關閉 LIFF 即回到原本開啟連結的聊天室。
      if (window.liff && typeof liff.isInClient === "function" && liff.isInClient()) {
        liff.closeWindow();
      } else {
        history.back();
      }
    });
  }

  function escapeHtml(value) {
    return value.replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function updateLensOptions() {
    const model = document.getElementById("model").value;
    const lensSelect = document.getElementById("lens");

    if (model === "vivo x300 Ultra") {
      lensSelect.innerHTML = `<option value="無加選配件 (單機身)">無加選配件 (單機身)</option><option value="加租 200mm 增距鏡 (+$300/D)">加租 200mm 增距鏡 (+$300/D)</option><option value="加租 400mm 增距鏡 (+$600/D)">加租 400mm 增距鏡 (+$600/D)</option>`;
    } else if (model === "vivo x200 Ultra" || model === "vivo x300 Pro") {
      lensSelect.innerHTML = `<option value="無加選配件 (單機身)">無加選配件 (單機身)</option><option value="加租 200mm 增距鏡 (+$300/D)">加租 200mm 增距鏡 (+$300/D)</option>`;
    } else if (model === "OPPO Find X9 Ultra") {
      lensSelect.innerHTML = `<option value="無加選配件 (單機身)">無加選配件 (單機身)</option><option value="加租 400mm 增距鏡 (+$600/D)">加租 400mm 增距鏡 (+$600/D)</option>`;
    } else if (model === "僅租借 G2 增距鏡頭特仕組") {
      lensSelect.innerHTML = `<option value="單租 200mm 增距鏡 ($300/D)">單租 200mm 增距鏡 ($300/D)</option><option value="單租 400mm 增距鏡 ($600/D)">單租 400mm 增距鏡 ($600/D)</option>`;
    } else {
      lensSelect.innerHTML = `<option value="無適配增距鏡">無適配增距鏡 (單機身)</option>`;
    }
  }
</script>
