<!-- 修正重點：請將原 index.html 的 LIFF 初始化與 submitBooking 相關程式替換成下方版本 -->
<script>
  const MY_LIFF_ID = "2011411630-pdbfMEEs";
  let liffReady = false;
  let loginRedirecting = false;

  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      liffReady = true;

      // 外部瀏覽器或未登入時，先完成 LINE 登入，再使用 sendMessages
      if (!liff.isInClient() && !liff.isLoggedIn() && !loginRedirecting) {
        loginRedirecting = true;
        liff.login({ redirectUri: window.location.href });
      }
    } catch (err) {
      console.error("LIFF 初始化失敗", err);
      alert("LINE 初始化失敗，請從 LINE 聊天室重新開啟預約頁面。");
    }
  }

  initLiff();

  async function submitBooking() {
    const submitBtn = document.getElementById("submitBtn");
    const model = document.getElementById("model").value;
    const lens = document.getElementById("lens").value;
    const cloud = document.getElementById("cloudService").value;
    const pickupTime = document.getElementById("pickupTime").value.replace("T", " ");
    const returnDate = document.getElementById("returnDate").value;
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const idType = document.getElementById("idType").value;
    const isStore = document.getElementById("isStore").value;

    if (!pickupTime || !returnDate || !name || !phone) {
      alert("請填寫完整的預約日期時間、姓名與聯絡電話。");
      return;
    }

    if (!liffReady) {
      alert("LINE 尚未初始化完成，請稍候再試。");
      return;
    }

    // sendMessages 不能在重新載入的 LIFF 頁面使用；必須重新從 LINE 聊天室開啟
    if (!liff.isInClient()) {
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
        return;
      }
      alert("請從 LINE 聊天室中的 LIFF 連結重新開啟本頁，再送出預約。");
      return;
    }

    if (typeof liff.isApiAvailable === "function" && !liff.isApiAvailable("sendMessages")) {
      alert("此 LIFF 頁面目前無法傳送訊息。請從 LINE 聊天室重新點開連結，不要使用最近使用服務重新載入。");
      return;
    }

    const pDate = new Date(pickupTime.split(" ")[0]);
    const rDate = new Date(returnDate);
    const days = Math.max(1, Math.round((rDate - pDate) / (1000 * 60 * 60 * 24)));

    let itemDetails = model;
    if (lens !== "無加選配件 (單機身)" && lens !== "無適配增距鏡") {
      itemDetails += ` + ${lens}`;
    }
    if (cloud.startsWith("Yes")) {
      itemDetails += " + 雲端上傳服務";
    }

    const bookingMessage =
`※租借器材：${itemDetails}
※預約日期：${pickupTime} 取 / ${returnDate} 還
※租借天數：${days} 天
※姓名：${name}
※電話：${phone}
押附證件：${idType}
台北大巨蛋門市交還機：${isStore}

基礎訂金 - 700元 (抵扣租金/報價為主)
預付定金方式 - 屬名本人帳號匯款
押金支付方式 - 現金 (交還退還含證件裝釘信封)`;

    submitBtn.disabled = true;
    submitBtn.textContent = "傳送中…";

    try {
      await liff.sendMessages([{ type: "text", text: bookingMessage }]);
      alert("預約資料已送出。");
      liff.closeWindow();
    } catch (err) {
      console.error("sendMessages 失敗", err);
      alert("送出失敗。請從 LINE 聊天室重新開啟預約連結後再試一次。");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "送出預約資料";
    }
  }
</script>
