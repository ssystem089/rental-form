<head>

<script>(function(){try{var s=localStorage.getItem("fir-theme");if(s==="dark"||(!s&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}})();</script>
<style>
/* 2026-11-09 使用者：地圖改用官網首頁那張（靜態地圖＋捷運出口、步行路線、門口照片），點地圖或按鈕開 Google Maps
   2026-11-09 歡迎卡「Google Maps 導航」改在 LINE 內 LIFF 半版開（?p=map 轉來這頁）：地圖嵌在頁內，要導航再按按鈕開 Google Maps */
/* accent 照官網首頁地圖 */
:root{--r:18px;--pill:rgba(255,255,255,.85);--ink-2:#6B5E52;--bg:#F6F1E9;--card:#FFFFFF;--ink:#28262F;--sub:#6F6A78;--line:#E2DDE8;--accent:#9A5B2C;--btn:#28262F;--btnfg:#FFFFFF}
[data-theme="dark"]{--ink-2:#B8AB9C;--bg:#17130F;--card:#1F1A15;--ink:#F1E8DC;--sub:#B9AC9B;--line:#3A3129;--accent:#9A5B2C;--btn:#F1E8DC;--btnfg:#17130F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.k{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:1px}
h1{font-size:22px;line-height:1.35;margin:6px 0 4px}
p{margin:2px 0;font-size:16px;line-height:1.6}
.sub{color:var(--sub)}
.mapwrap{margin:16px 0 4px}
/* 指定地點：靜態地圖卡（2026-10-29 使用者：比 Google 內嵌好看；點地圖開 Google，另有 Apple／Google 按鈕） */
.smap{position:relative;display:block;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 30px -22px rgba(43,35,29,.5)}
.smap img{display:block;width:100%;height:auto;aspect-ratio:900/560;object-fit:cover}
.pin{position:absolute;width:18px;height:18px;margin:-18px 0 0 -9px;background:var(--accent);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(43,35,29,.45)}
.pin-label{position:absolute;left:50%;bottom:22px;transform:rotate(45deg) translate(-10%,0);transform-origin:left bottom;white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px}
.smap-hint{position:absolute;right:10px;top:10px;background:var(--pill);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px}
.map-credit{margin:6px 0 0;font-size:11px;color:var(--ink-2);text-align:right}
/* 地圖加捷運 1 號出口、步行路線、門市實景小圖（2026-10-29 使用者） */
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route-bg{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route-line{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 12}
.exit-dot{fill:#0070BD;stroke:#fff;stroke-width:3}
.exit-tag,.walk-tag{position:absolute;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px 4px 4px;display:inline-flex;align-items:center;gap:5px;box-shadow:0 3px 8px rgba(43,35,29,.25)}
.exit-tag{background:#fff;color:#0B4F87}
.exit-tag b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#0070BD;color:#fff;font-size:11px}
.walk-tag{transform:translate(8px,-50%);background:var(--accent);color:#fff;padding:4px 9px}
.dome-tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px 4px 7px;display:inline-flex;align-items:center;gap:4px;background:#2B231D;color:#fff;box-shadow:0 3px 8px rgba(43,35,29,.3)}
/* 2026-10-30 使用者：地圖加台北大巨蛋地標 */
.store-pic{position:absolute;left:3%;top:5%;width:30%;max-width:170px;background:#fff;border-radius:12px;padding:4px 4px 3px;box-shadow:0 8px 18px -8px rgba(43,35,29,.55)}
.store-pic img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:9px}
.store-pic span{display:block;text-align:center;font-size:10.5px;font-weight:800;color:var(--ink);padding-top:3px}
[data-theme="dark"] .smap img{filter:brightness(.82) contrast(1.05)}
/* 地圖上的標籤固定深字／深底（地圖本身是淺色，不跟深色模式變） */
.pin-label{background:#2B231D;color:#fff}
.store-pic span{color:#2B231D}
/* 2026-10-30 使用者：地圖只突顯「取還點」，其他藥丸（出口、步行、大巨蛋、點地圖導航）淡化 */
.smap .exit-tag,.smap .walk-tag,.smap .dome-tag,.smap .smap-hint{opacity:.62;box-shadow:none}
@media (max-width:420px){.exit-tag,.walk-tag,.dome-tag{font-size:10px}.store-pic{width:32%}}
.smap-hint{display:none}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:var(--btn);color:var(--btnfg);font-size:17px;font-weight:700;text-decoration:none}
.go:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note{margin-top:12px;font-size:14px;color:var(--sub);text-align:center}
/* 2026-11-11 使用者：右上加 EN 與日夜切換（同官網／價目表頁，語言與主題記在同一組 localStorage） */
.bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.bar button{min-height:32px;min-width:32px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 11.5px/1 -apple-system,"PingFang TC",sans-serif;letter-spacing:.5px;cursor:pointer;display:inline-grid;place-items:center}
.bar button:active{transform:scale(.94)}
.bar svg{display:block}
[data-theme="dark"] .ico-sun{display:none}
html:not([data-theme="dark"]) .ico-moon{display:none}
</style>
</head>
<body>

<script>
var T={zh:{k:"門市取還",h1:"FiX iT RiGHT 修成正果 大巨蛋門市",addr:"台北市大安區光復南路88號1樓",sub:"大巨蛋旁步行 3 分鐘｜週一至週六 12:00–20:00",go:"開啟 Google Maps 導航 ↗",note:"取還時間以客服確認為準",btn:"EN"},
       en:{k:"PICKUP & RETURN",h1:"FiX iT RiGHT · Taipei Dome Store",addr:"1F, No. 88, Guangfu S. Rd., Da'an Dist., Taipei",sub:"3 min walk from Taipei Dome | Mon–Sat 12:00–20:00",go:"Open Google Maps directions ↗",note:"Pickup / return time as confirmed by our staff",btn:"中"}};
function setLang(l){var t=T[l]||T.zh;document.documentElement.lang=l==="en"?"en":"zh-Hant-TW";
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=t[e.getAttribute("data-i18n")]});
  document.getElementById("langBtn").textContent=t.btn;window.__lang=l;try{localStorage.setItem("fir-language",l)}catch(e){}}
function toggleLang(){setLang(window.__lang==="en"?"zh":"en")}
function toggleTheme(){var d=document.documentElement.getAttribute("data-theme")==="dark";
  if(d)document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme","dark");
  try{localStorage.setItem("fir-theme",d?"light":"dark")}catch(e){}}
(function(){var s=null;try{s=localStorage.getItem("fir-language")}catch(e){}
  setLang(s==="en"||s==="zh"?s:(/^(en|ja|ko)/i.test(navigator.language||"")?"en":"zh"))})();
</script>
