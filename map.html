<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>門市導航｜FiX iT RiGHT 修成正果 大巨蛋門市</title>
<meta name="robots" content="noindex">
<script>(function(){try{var s=localStorage.getItem("fir-theme");if(s==="dark"||(!s&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}})();</script>
<style>
/* 2026-11-09 歡迎卡「Google Maps 導航」改在 LINE 內 LIFF 半版開（?p=map 轉來這頁）：地圖嵌在頁內，要導航再按按鈕開 Google Maps */
:root{--bg:#F6F1E9;--card:#FFFFFF;--ink:#28262F;--sub:#6F6A78;--line:#E2DDE8;--accent:#70549F;--btn:#28262F;--btnfg:#FFFFFF}
[data-theme="dark"]{--bg:#17130F;--card:#1F1A15;--ink:#F1E8DC;--sub:#B9AC9B;--line:#3A3129;--accent:#C9B6F0;--btn:#F1E8DC;--btnfg:#17130F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.k{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:1px}
h1{font-size:22px;line-height:1.35;margin:6px 0 4px}
p{margin:2px 0;font-size:16px;line-height:1.6}
.sub{color:var(--sub)}
.map{margin:16px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);aspect-ratio:4/3}
.map iframe{width:100%;height:100%;border:0;display:block}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:var(--btn);color:var(--btnfg);font-size:17px;font-weight:700;text-decoration:none}
.go:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note{margin-top:12px;font-size:14px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<main>
  <div class="k">門市取還</div>
  <h1>FiX iT RiGHT 修成正果 大巨蛋門市</h1>
  <p>台北市大安區光復南路88號1樓</p>
  <p class="sub">大巨蛋旁步行 3 分鐘｜週一至週六 12:00–20:00</p>
  <div class="map"><iframe title="門市位置地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
    src="https://www.google.com/maps?q=FiX+iT+RiGHT+%E4%BF%AE%E6%88%90%E6%AD%A3%E6%9E%9C+%E5%8F%B0%E5%8C%97%E5%B8%82%E5%A4%A7%E5%AE%89%E5%8D%80%E5%85%89%E5%BE%A9%E5%8D%97%E8%B7%AF88%E8%99%9F&amp;z=17&amp;output=embed"></iframe></div>
  <a class="go" href="https://maps.app.goo.gl/1UeTJMKtvYxRcxqk9" target="_blank" rel="noopener">開啟 Google Maps 導航 ↗</a>
  <p class="note">取還時間以客服確認為準</p>
</main>
</body>
</html>
